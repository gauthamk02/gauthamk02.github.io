- id: monai-us-wg
  type: opensource
  title: "MONAI Ultrasound Working Group"
  role: Open Source Contributor
  date: "2025-12"
  period: "Dec 2025 – Present"
  desc: >-
    Built the working group's unified evaluation pipeline, which benchmarks any model–dataset pair through
    one interface and replaces per-model ad hoc scripts. With it I benchmarked 3 text-promptable
    segmentation foundation models on 13 public ultrasound datasets (11 anatomies, 120k+ images), which is
    now the group's reference comparison. I also maintain a repository that packages public ultrasound
    datasets in one standard format.
  links:
    - label: Dataset
      url: "https://huggingface.co/datasets/us-segmentator/us-segmentation-dataset"
    - label: Benchmark code
      url: "https://github.com/gauthamk02/us_multi_anatomy_seg"
    - label: MONAI
      url: "https://monai.io"

- id: slicer-eval-mcp
  type: opensource
  title: "slicer-eval-mcp"
  date: "2026-11"
  period: "November 2026"
  desc: >-
    An open-source MCP server through which VLM agents operate 3D Slicer, the widely used
    platform for medical image viewing. Agents examine a volumetric scan with tools for the 3D view, rendering
    presets, clipping, slices, measurements and segmentations, and never execute model-generated code. Every
    tool call is logged with its arguments, resulting state and images, so each session can be audited,
    replayed and scored.
  links:
    - label: Code
      url: "https://github.com/Maitri-Labs-Amrita/slicer-eval-mcp"

- id: gsoc-deepchem
  type: opensource
  title: "Google Summer of Code 2024, DeepChem"
  role: Contributor
  date: "2024-05"
  period: "May – Aug 2024"
  desc: >-
    Integrated `torch.compile()` into DeepChem, the Python library for deep learning on molecules and
