# Entries for the Works page (/works/).
#
# type:   patent | paper | opensource | award (shown under Competitions)
# date:   YYYY-MM, used for sorting (newest first) and year grouping
# period: optional display date; falls back to the year of `date`
# authors: "G. K. Priya" is bolded automatically
# links:  label + url; leave url empty to show a greyed-out "coming soon" link

- id: chd-bench
  type: paper
  title: "CHD-Bench: Diagnosing Congenital Heart Disease through Interactive Examination"
  authors: "G. K. Priya, S. Vasu, A. Vijesh, R. Rameshbabu, H. A. Maya, S. Xavier, M. Kappanayil, G. Gressel"
  venue: "arXiv:2611.33775"
  status: Preprint
  date: "2026-11"
  desc: >-
    The first model-agnostic benchmark and harness in which VLM agents diagnose congenital
    heart disease by interactively examining 3D cardiac CT and MRI inside a live 3D Slicer session. Through
    22 tools, agents view slices, manipulate the 3D view, clip, measure and display segmentations the way a
    radiologist does, instead of reading a fixed set of pre-selected images. The best agent reaches an F1 of
    0.65 and beats every other method we evaluated.
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2611.33775"
    - label: Code
      url: "https://github.com/Maitri-Labs-Amrita/CHD-Bench"

- id: pdac-eus
  type: paper
  title: "Automated Patient-Level Pancreatic Ductal Adenocarcinoma Detection from B-Mode EUS Video: A Retrospective Diagnostic Accuracy Study"
  authors: "G. K. Priya, A. Swain, A. Kaimal, …, G. Gressel, P. Nair"
  venue: "Endoscopic Ultrasound"
  status: Under review
  date: "2026-06"
  desc: >-
    A CNN–Transformer–MIL architecture that detects pancreatic cancer for a whole patient directly from
    endoscopic ultrasound video, fast enough (under 50 ms) to run live during the procedure. The model
    reads the B-mode video an endoscopist already captures, so it needs no extra imaging or manual frame
    selection. This study measures its diagnostic accuracy on retrospective clinical EUS procedures.

- id: fmc-uia-paper
  type: paper
  title: "Towards a Generalist Ultrasound Foundation Model via Task-Adaptive Multi-Task Learning"
  authors: "A. Swain, G. K. Priya, A. Vijesh"
  venue: "Foundation Model Challenge for Ultrasound Image Analysis (FMC-UIA), ISBI 2026"
  status: Challenge paper
  date: "2026-01"
  desc: >-
    One multi-task model that handles segmentation, classification, detection and regression across 22
    public ultrasound datasets. Task-adaptive multi-task learning lets a single shared model serve every
    task, instead of training a separate specialist per dataset. This is our entry to the ISBI 2026
    challenge, where it ranked 7th worldwide.
  links:
    - label: Paper
      url: "https://www.researchgate.net/profile/Jieyun-Bai/publication/405206599_Foundation_Model_Challenge_for_Ultrasound_Image_Analysis/links/6a12efd4719db12f6b1315b7/Foundation-Model-Challenge-for-Ultrasound-Image-Analysis.pdf#page=11"

